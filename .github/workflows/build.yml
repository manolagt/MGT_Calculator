name: Build MGT Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libffi-dev libssl-dev cmake

      - name: Install Buildozer
        run: |
          pip3 install --user --upgrade pip
          pip3 install --user buildozer Cython==0.29.36

      - name: Create Buildozer configuration
        run: |
          cat > buildozer.spec <<'EOF'
          [app]
          title = MGT Calculator
          package.name = mgtcalculator
          package.domain = org.mgtcalculator
          source.dir = .
          source.include_exts = py,wav,png,jpg,kv,atlas
          version = 1.0
          requirements = python3,kivy
          orientation = portrait
          fullscreen = 0
          android.api = 33
          android.minapi = 21
          android.archs = arm64-v8a
          android.accept